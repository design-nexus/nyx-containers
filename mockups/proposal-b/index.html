// ---------- Workload cards ----------
function met(label, val, sp) {
  return `<div class="met"><div class="top"><span class="lbl">${label}</span><span class="v">${val}</span></div>${sp}</div>`;
}
function wl(w) {
  const tags = (w.tags || []).join('');
  const star = w.star ? ic('star', 'star') : '';
  const who = `<div class="who"><span class="tile">${ic(w.icon)}<span class="dot ${w.state}"></span></span>
    <div style="min-width:0"><div class="name"><b>${w.name}</b>${star}${tags}</div>
    <div class="sub"><span class="kind">${w.kind}</span><span class="sep-dot">·</span>${w.sub}${w.ipInline ? `<span class="ip-inline"><span class="sep-dot">·</span>${w.ipInline}</span>` : ''}</div></div></div>`;
  const info = `<div class="info"><div class="l1">${w.l1}</div><div class="l2">${w.l2}</div></div>`;
  const mid = w.idle
    ? `<div class="idle-note">${w.idle}</div>`
    : met('CPU', w.cpu[2], spark(w.cpu[0], w.cpu[1], { vol: 0.26 })) + met('MEM', w.mem[2], spark(w.mem[0], w.mem[1], { vol: 0.05, cap: w.mem[3] }));
  return `<div class="wl ${w.state === 'off' ? 'off' : ''} ${w.hover ? 'hover' : ''}" ${w.style ? `style="${w.style}"` : ''}>${who}${info}${mid}<div class="acts">${w.acts}</div>${w.extra || ''}</div>`;
}
function svc(s) {
  return `<div class="svc"><div class="who"><span class="dot ${s.state || 'run'}" style="box-shadow:none;width:7px;height:7px"></span><b>${s.name}</b><span class="dim ell mono" style="font-size:11px">${s.image}</span></div>
    <div class="info flex g6">${s.port || '<span class="ter">no ports</span>'}</div>
    <div class="mini"><span class="ter" style="font-size:10.5px;font-weight:600;letter-spacing:.06em">CPU</span><span class="bar"><b style="width:${s.cpu[0]}%"></b></span><span>${s.cpu[1]}</span></div>
    <div class="mini"><span class="ter" style="font-size:10.5px;font-weight:600;letter-spacing:.06em">MEM</span><span class="bar"><b style="width:${s.mem[0]}%"></b></span><span>${s.mem[1]}</span></div>
    <div class="acts">${ib('logs', 'opt-wide')}${ib('terminal', 'opt-wide')}${ib('restart')}${ib('more')}</div></div>`;
}
const port = (p, link) => `<span class="port ${link ? 'link' : ''}">${p}${link ? ic('ext') : ''}</span>`;

    wl({ icon: 'vm', kind: 'VM', name: 'nyxos-dev', state: 'run', sub: 'NixOS 25.05 · 6 vCPU · 12 GB', ipInline: '10.10.0.31',

    wl({ icon: 'docker', kind: 'DOCKER', name: 'open-webui', state: 'err', sub: 'ghcr.io/open-webui/open-webui:main', ipInline: 'exited (1)',
      tags: ['<span class="tag bad">Exited (1)</span>'],

  return `<div class="view pad">${strip}${tools}

  const tree = [60, 72, 48, 80, 54, 66, 40].map((w, k) => bar(w, k === 3 ? '#e8e8e8' : '#8a8a8a')).join('');

}

function dockerLogs() {
  const L = (ts, lv, msg, hit) => `<div class="lg ${hit ? 'hit' : ''}"><span class="ts">${ts}</span><span class="lv ${lv[0].toLowerCase()}">${lv}</span><span class="msg">${msg}</span></div>`;

function stackCompose() {
  const src = [
    ['<span class="k">name</span>: <span class="s">paperless</span>'],
    ['<span class="k">services</span>:'],
    ['  <span class="k">broker</span>:'],
    ['    <span class="k">image</span>: <span class="s">docker.io/library/redis:7</span>'],
    ['    <span class="k">restart</span>: <span class="c">unless-stopped</span>'],
    ['    <span class="k">volumes</span>: [<span class="s">redisdata:/data</span>]'],
    [''],
    ['  <span class="k">db</span>:'],
    ['    <span class="k">image</span>: <span class="s">docker.io/library/postgres:16</span>'],
    ['    <span class="k">restart</span>: <span class="c">unless-stopped</span>'],
    ['    <span class="k">volumes</span>: [<span class="s">pgdata:/var/lib/postgresql/data</span>]'],
    ['    <span class="k">environment</span>:'],
    ['      <span class="t">POSTGRES_DB</span>: <span class="s">paperless</span>'],
    ['      <span class="t">POSTGRES_PASSWORD</span>: <span class="c">${DB_PASSWORD}</span>'],
    [''],
    ['  <span class="k">webserver</span>:'],
    ['    <span class="k">image</span>: <span class="s">ghcr.io/paperless-ngx/paperless-ngx:2.14.0</span>', 1],
    ['    <span class="k">depends_on</span>: [<span class="s">db</span>, <span class="s">broker</span>, <span class="s">gotenberg</span>]'],
    ['    <span class="k">ports</span>: [<span class="s">"8000:8000"</span>]'],
    ['    <span class="k">environment</span>:'],
    ['      <span class="t">PAPERLESS_REDIS</span>: <span class="s">redis://broker:6379</span>'],
    ['      <span class="t">PAPERLESS_OCR_LANGUAGE</span>: <span class="s">eng+deu</span>', 1],
    ['    <span class="k">labels</span>:'],
    ['      <span class="t">nyx.webui</span>: <span class="s">http://localhost:8000</span>  <span class="cm"># the card\'s Web UI button</span>'],
    [''],
    ['  <span class="k">gotenberg</span>:'],
    ['    <span class="k">image</span>: <span class="s">docker.io/gotenberg/gotenberg:8</span>'],
  ];
  const lns = src.map((_, k) => k + 1).join('\n');
  const code = src.map(([l, chg]) => chg ? `<span class="chg">${l}</span>` : l).join('\n');
  const tb = `<div class="tb">${subnav(STACK_NAV, 'Compose')}
    <span class="grow"></span><span class="btn sm">${ic('check')}Validate</span><span class="btn sm">${ic('download')}Pull</span><span class="btn sm primary">${ic('rocket')}Deploy</span><span class="div"></span>${ib('globe')}${ib('restart')}${power()}${ib('more')}</div>`;
  const editor = `<div class="card editor"><div class="ed-tabs" style="align-items:center"><span class="tab active" style="padding-right:9px">${ic('code')}compose.yaml<span class="tag acc" style="margin-left:2px">2</span></span><span class="tab" style="padding-right:9px">${ic('sliders')}.env</span><span class="grow"></span>
    <span class="chip" style="height:26px;font-size:12px">${ic('git')}github.com/ken/homelab<span class="ter">· stacks/paperless · main</span></span><span class="tag ok">Auto-update</span>${ib('copy', 'sm')}</div>
    <div class="code"><div class="ln">${lns}</div><div class="src">${code}</div></div></div>`;
  const s = (name, img, st, prt) => `<div class="opt" style="min-height:40px;padding:6px 14px"><span class="dot ${st}" style="box-shadow:none;width:7px;height:7px"></span><div class="grow" style="min-width:0"><div style="font-weight:500">${name}</div><div class="d mono ell" style="font-size:11px">${img}</div></div>${prt || ''}</div>`;
  const drawer = `<div class="drawer">
    <div class="card"><div class="card-h">${ic('info')}<span class="t">Not deployed yet</span></div>
      <div style="padding:2px 14px 14px;font-size:12.5px;display:flex;flex-direction:column;gap:7px">
        <div class="flex g8"><span class="tag acc">webserver</span><span class="dim">image 2.13.5 → <span class="mono" style="color:var(--text)">2.14.0</span></span></div>
        <div class="flex g8"><span class="tag acc">webserver</span><span class="dim">OCR language eng → <span class="mono" style="color:var(--text)">eng+deu</span></span></div>
        <div class="ter" style="font-size:12px;margin-top:2px">Deploy recreates webserver only.</div></div></div>
    <div class="card"><div class="card-h">${ic('stack')}<span class="t">Services</span><span class="ter" style="font-size:12px">4 of 4 running</span></div>
      <div style="padding-bottom:6px">${s('webserver', 'paperless-ngx:2.13.5', 'run', '<span class="port link">:8000' + ic('ext') + '</span>')}${s('db', 'postgres:16', 'run')}${s('broker', 'redis:7', 'run')}${s('gotenberg', 'gotenberg:8', 'run')}</div></div>
    <div class="card"><div class="card-h">${ic('clock')}<span class="t">Deploys</span></div>
      <div class="kv" style="grid-template-columns:70px minmax(0,1fr)"><span>Nov 4</span><span>a41c9e2 · auto-update · OK</span><span>Oct 30</span><span>7d02b1f · by you · OK</span><span>Oct 21</span><span>first deploy</span></div></div>
  </div>`;
  const body = `${tb}<div class="split-h">${editor}${drawer}</div>`;
  return frame({ sub: 'paperless', nav: 'stacks', tabs: TABS('paperless'), body });
}

function createWizard() {
  const steps = [['Type', 1], ['Image', 2], ['Resources', 0], ['Storage', 0], ['Network', 0], ['Sharing', 0], ['Review', 0]]
    .map(([t, s], k) => `<div class="step ${s === 1 ? 'done' : ''} ${s === 2 ? 'cur' : ''}"><span class="n">${s === 1 ? ic('check') : k + 1}</span>${t}</div>`).join('');
  const img = (bg, l, t, d, sel) => `<div class="img ${sel ? 'sel' : ''}"><span class="logo" style="background:${bg}">${l}</span><div style="min-width:0"><div class="t">${t}</div><div class="d">${d}</div></div></div>`;
  const imgs = [
    img('#e95420', 'U', 'Ubuntu 24.04 LTS', 'Desktop · 1.1 GB', 1),
    img('#a80030', 'D', 'Debian 12', 'Desktop · 860 MB'),
    img('#3c6eb4', 'F', 'Fedora 41', 'Workstation · 1.3 GB'),
    img('#1793d1', 'A', 'Arch Linux', 'Cloud · 520 MB'),
    img('#5277c3', 'N', 'NixOS 25.05', 'Desktop · 1.0 GB'),
    img('#0067c0', 'W', 'Windows 11', 'From an ISO · virtio drivers added'),
    img('#73ba25', 'S', 'openSUSE Tumbleweed', 'Desktop · 1.2 GB'),
    img('#0d597f', 'Al', 'Alpine 3.21', 'Cloud · 60 MB'),
    img('var(--track)', ic('disc'), 'Another ISO…', 'Any bootable image'),
  ].join('');
  const res = (l, frac, v) => `<div class="res"><span class="dim">${l}</span><div class="slider"><div class="tr"><div class="fill" style="width:${frac}%"></div></div><div class="kn" style="left:${frac}%"></div></div><span class="rv">${v}</span></div>`;
  const dlg = `<div class="veil"><div class="dialog">
    <div class="steps"><div class="h">New workload</div>${steps}</div>
    <div class="dlg-body"><div class="dlg-main">
      <span class="seg" style="align-self:flex-start"><span class="on">${ic('vm')}Virtual machine</span><span>${ic('lxc')}LXC container</span><span>${ic('docker')}Docker</span><span>${ic('stack')}Compose stack</span></span>
      <div class="flex g8"><div class="field grow">${ic('search')}<span class="ph">Search images</span></div><span class="dd">${ic('cloud')}images.linuxcontainers.org${ic('chev')}</span></div>
      <div class="imgs">${imgs}</div>

    <div class="dlg-foot"><span class="ter" style="font-size:12px">${ic('info').replace('data-i', 'data-i style="width:14px;height:14px;vertical-align:-2px;margin-right:6px"')}SPICE display, clipboard and 3D are set up for you.</span><span class="grow"></span><span class="btn">Cancel</span><span class="btn">Back</span><span class="btn primary">Next</span></div>
    </div></div></div>`;
  return frame({ sub: 'Overview', nav: 'overview', tabs: TABS('overview'), body: overviewBody(), overlay: dlg });
}

function hostPage() {
  const gauges = `<div class="card"><div class="card-h">${ic('laptop')}<span class="t">This computer</span><span class="ter" style="font-size:12px">Ryzen 9 7900 · 12 cores · 32 GB</span></div>
    <div class="gauges">${gauge(0.23, 'CPU', '12 cores')}${gauge(0.61, 'Memory', '19.5 of 32 GB')}${gauge(0.56, 'Disk', '264 of 476 GB')}${gauge(0.04, 'Swap', '0.3 of 8 GB')}</div></div>`;
  const W = 400, H = 120;
  const cpu = pathOf(series(91, 60, 0.3, 0.22), W, H), mem = pathOf(series(92, 60, 0.6, 0.05), W, H);
  const grid = [0.25, 0.5, 0.75].map((f) => `<line class="gl" x1="0" x2="${W}" y1="${H * f}" y2="${H * f}"/>`).join('');
  const chart = `<div class="card"><div class="card-h">${ic('heart')}<span class="t">Last hour</span><span class="end"><span class="seg sm"><span class="on">1 h</span><span>24 h</span><span>7 d</span></span></span></div>
    <div class="bigchart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}
      <path d="${cpu} L${W} ${H} L0 ${H} Z" fill="color-mix(in srgb, var(--accent) 14%, transparent)"/><path d="${cpu}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <path d="${mem}" fill="none" stroke="var(--sw-teal)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-dasharray="5 4"/></svg></div>
    <div class="legend"><span><b style="background:var(--accent)"></b>CPU</span><span><b style="background:var(--sw-teal)"></b>Memory</span><span class="grow"></span><span>Peak 71% at 21:42 · nyxos-dev build</span></div></div>`;
  const eng = (n, v, d) => `<div class="opt"><span class="dot run" style="box-shadow:none"></span><div class="grow"><div style="font-weight:500">${n} <span class="ter" style="font-weight:400">${v}</span></div><div class="d">${d}</div></div>${ib('restart', 'sm')}${ib('logs', 'sm')}</div>`;
  const engines = `<div class="card"><div class="card-h">${ic('logo')}<span class="t">Engines</span></div><div style="padding-bottom:6px">
    ${eng('Docker', '27.5.1', 'overlay2 · /var/lib/docker · 7 containers')}${eng('Incus', '6.9', 'default pool on btrfs · 4 instances')}</div></div>`;
  const ck = (t, ok = true) => `<div class="check ${ok ? '' : 'no'}">${ic(ok ? 'checkc' : 'alert')}<span>${t}</span></div>`;
  const virt = `<div class="card"><div class="card-h">${ic('shield')}<span class="t">VM features</span></div>
    <div style="padding:6px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:9px 14px">${ck('KVM')}${ck('IOMMU · GPU passthrough')}${ck('Nested virtualization')}${ck('SPICE and virtio-gpu 3D')}${ck('virtiofs shared folders')}${ck('swtpm · vTPM')}${ck('UEFI and Secure Boot')}${ck('spice-vdagent missing in 1 VM', false)}</div></div>`;
  const pool = (t, d, frac, r, warn) => `<div class="pool"><div><div class="t">${t}</div><div class="d">${d}</div></div><div class="r">${r}</div><div class="bar ${warn ? 'warn' : ''}"><b style="width:${frac}%"></b></div></div>`;
  const storage = `<div class="card"><div class="card-h">${ic('storage')}<span class="t">Storage</span><span class="end">${ib('plus', 'sm')}</span></div><div style="padding-bottom:8px">
    ${pool('default', 'Incus · btrfs · /var/lib/incus', 44, '212 GB free')}${pool('Docker data', 'overlay2 · images, volumes, build cache', 18, '84 GB used')}${pool('Backups', 'Folder · /mnt/t7/backups · external', 82, '38 GB free', 1)}</div></div>`;
  const clean = (t, v, d) => `<div class="opt" style="min-height:40px"><div class="grow"><div>${t}</div></div><span class="ter tnum" style="font-size:12px">${d}</span><span class="tnum" style="width:64px;text-align:right;font-weight:500">${v}</span></div>`;
  const cleanup = `<div class="card"><div class="card-h">${ic('broom')}<span class="t">Clean up</span><span class="ter" style="font-size:12px">9.3 GB can be freed</span></div><div>
    ${clean('Unused images', '3.1 GB', '6 of 14')}${clean('Build cache', '2.4 GB', 'Docker')}${clean('Incus image cache', '2.2 GB', '4 images')}${clean('Unused volumes', '1.4 GB', '3')}${clean('Stopped containers', '180 MB', '2')}</div>
    <div class="flex g8" style="padding:8px 14px 14px;justify-content:flex-end"><span class="btn sm">Review…</span><span class="btn sm danger">${ic('trash')}Free 9.3 GB</span></div></div>`;
  const body = `<div class="view pad"><div class="flow">${gauges}${chart}</div><div class="flow" style="margin-top:12px">${engines}${virt}</div><div class="flow" style="margin-top:12px">${storage}${cleanup}</div></div>`;
  return frame({ sub: 'This computer', nav: 'host', tabs: TABS('host'), body });
}
